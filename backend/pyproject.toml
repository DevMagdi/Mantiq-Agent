[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "procureai-backend"
version = "1.0.0"
description = "ProcureAI - AI Procurement Agent Platform (Mantiq Technologies)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "pydantic[email]>=2.8",
  "pydantic-settings>=2.4",
  "pyjwt>=2.9",
  "argon2-cffi>=23.1",
  "httpx>=0.27",
  "openpyxl>=3.1",
  "reportlab>=4.2",
  # Arabic shaping for the PO PDF: reportlab shapes through HarfBuzz, which it only does when this
  # wheel is importable. Apache-2.0 (bundles HarfBuzz, Old-MIT).
  "uharfbuzz>=0.39",
  "python-multipart>=0.0.9",
  "celery>=5.4,<6",
  "redis>=5,<6",
  "typer>=0.12",
  "cryptography>=42",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  # A real redis-server for the fan-out proof and scripts/e2e_journeys.py. It ships a prebuilt
  # binary, so CI does not need a Redis service to test multi-replica delivery.
  "redislite>=6.2",
]

[project.scripts]
procureai = "app.cli:app"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.agents.prompts" = ["*.md", "*.txt"]
# The Arabic face and its licence must ship with the code: a PDF that only renders on a machine with
# an installed Arabic font is not a document you can send to a supplier.
"app" = ["assets/fonts/*.ttf", "assets/fonts/*.txt"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
# SQLAlchemy's async engine drives the sync ORM through greenlets, so the tracer must follow
# greenlet switches or every endpoint body stops being recorded right after its first await.
concurrency = ["greenlet", "thread"]
source = ["app"]

[tool.coverage.report]
omit = ["*/tests/*", "*/migrations/*"]
skip_covered = false
show_missing = true
