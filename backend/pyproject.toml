[project]
name = "procureai-backend"
version = "1.0.0"
description = "ProcureAI - AI Procurement Agent Platform (Mantiq Technologies)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "asyncpg>=0.29",
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pyjwt>=2.9",
  "argon2-cffi>=23.1",
  "httpx>=0.27",
  "openpyxl>=3.1",
  "reportlab>=4.2",
  "python-multipart>=0.0.9",
  "celery>=5.4,<6",
  "redis>=5,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "pytest-cov>=5.0", "ruff>=0.5"]

[project.scripts]
procureai = "app.cli:app"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
# SQLAlchemy's async engine drives the sync ORM through greenlets, so the tracer must follow
# greenlet switches or every endpoint body stops being recorded right after its first await.
concurrency = ["greenlet", "thread"]
source = ["app"]

[tool.coverage.report]
omit = ["*/tests/*", "*/migrations/*"]
skip_covered = false
show_missing = true
