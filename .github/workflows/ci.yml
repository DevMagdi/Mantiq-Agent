name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  backend:
    name: Backend (lint, migrate, tests, coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Migrations are consistent with the models
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci.db
          SECRET_KEY: ci-secret-key-0123456789abcdef0123456789
        run: |
          alembic upgrade head
          alembic check

      - name: Tests with coverage
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci.db
          SECRET_KEY: ci-secret-key-0123456789abcdef0123456789
          LLM_PROVIDER: fake
          RATE_LIMIT_ENABLED: "false"
        run: pytest tests -q --cov=app --cov-report=term-missing --cov-report=xml

      - name: Enforce the coverage floor
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("coverage.xml").getroot()
          rate = float(root.get("line-rate")) * 100
          print(f"line coverage: {rate:.1f}%")
          assert rate >= 80, f"coverage {rate:.1f}% is below the 80% floor"
          PY

      - name: End-to-end journeys against two real replicas and a real Redis
        env:
          SECRET_KEY: ci-secret-key-0123456789abcdef0123456789
        run: python ../scripts/e2e_journeys.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml

  postgres:
    name: PostgreSQL 16 (migrations, RLS, search indexes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: procureai
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: procureai
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U procureai -d procureai"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://procureai:change-me@localhost:5432/procureai
      SECRET_KEY: ci-secret-key-0123456789abcdef0123456789
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Migrate a real PostgreSQL 16 from scratch
        run: alembic upgrade head

      - name: No model/migration drift on PostgreSQL
        run: alembic check

      - name: SQLite is refused outside test/sandbox
        env:
          APP_ENV: staging
          DATABASE_URL: sqlite+aiosqlite:///./should-not-start.db
        run: |
          python - <<'PY'
          import asyncio
          from app.main import _assert_supported_database
          try:
              _assert_supported_database()
          except RuntimeError as exc:
              assert "PostgreSQL 16" in str(exc), exc
              print("refused as expected:", str(exc)[:80])
          else:
              raise SystemExit("SQLite was accepted outside test/sandbox")
          PY

      - name: Seed the demo dataset through the CLI (also proves the CLI works on PostgreSQL)
        run: python -m app.cli seed-demo

      - name: Tenant isolation is enforced by RLS
        run: python ../scripts/verify_rls.py

      - name: Concurrent double-submits cannot corrupt the books
        env:
          RATE_LIMIT_ENABLED: "false"
          # This proof is *about* the accounting module (posting, invoice payment, approval decision),
          # and the module ships hidden behind a deployment switch. The switch is turned on here
          # explicitly, exactly as the accounting test modules do, rather than weakening the check.
          ACCOUNTING_ENABLED: "true"
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 --log-level warning &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health > /dev/null; then break; fi
            sleep 1
          done
          python ../scripts/concurrency_check.py --base-url http://127.0.0.1:8000

  frontend:
    name: Frontend (typecheck, lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Typecheck (strict)
        run: npm run typecheck
      - name: Lint (zero warnings)
        run: npm run lint
      - name: Unit / component tests
        run: npm run test
      - name: Browser tests compile (strict)
        run: npm run e2e:typecheck
      - name: Production build
        run: npm run build

  containers:
    name: Container images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.api
          push: false
          tags: procureai/api:ci

      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.worker
          push: false
          tags: procureai/worker:ci

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.web
          push: false
          tags: procureai/web:ci

  chart:
    name: Helm chart lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/procureai
      - run: helm template procureai deploy/helm/procureai --set existingSecret=ci-secrets > /dev/null

  security:
    name: Secrets & dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Block committed secrets
        run: |
          if git grep -nIE "(AKIA[0-9A-Z]{16}|-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY-----|sk-[A-Za-z0-9]{20,})" -- . \
             ':!docs/*' ':!frontend/package-lock.json' ':!backend/tests/*'; then
            echo "::error::possible secret committed"; exit 1
          fi

      - name: Python dependencies audit (advisory)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install ./backend
          pip-audit || echo "::warning::pip-audit reported findings"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Node dependencies audit (advisory)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high || echo "::warning::npm audit reported findings"
